<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ManualBuilder</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=0.26.0">
  <script src="/vendor/htmx-2.0.10.min.js" defer></script>
  <script src="/assets/js/app.js?v=0.26.0" defer></script>
</head>
<body hx-headers='{"X-Manual-Token":"__TOKEN__"}'>
  <div id="app-root" hx-get="/ui/workspace" hx-trigger="load" hx-swap="innerHTML">
    <div class="boot-screen" role="status">
      <div class="boot-screen__mark">M</div>
      <div>
        <strong>ManualBuilderを準備しています</strong>
        <span>マニュアル一覧を読み込んでいます…</span>
      </div>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
